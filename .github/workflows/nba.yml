name: NBA registro diario

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 6 * * *"
    - cron: "*/10 22-23,0-7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas firebase-admin
      - name: Ejecutar colector
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          MODO: ${{ github.event.schedule == '0 6 * * *' && 'resultados' || github.event.schedule == '0 12 * * *' && 'registro' || github.event_name == 'workflow_dispatch' && 'registro' || 'vivo' }}
        run: python colector.py
      - name: Guardar CSV en el repositorio
        run: |
          git config user.name "registro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add registro_en_vivo.csv
          git diff --cached --quiet || git commit -m "Actualizar registro"
          git pull --rebase
          git push
