name: analisis factor

on:
  workflow_dispatch:

jobs:
  factor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install firebase-admin
      - run: python analisis_factor.py
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
