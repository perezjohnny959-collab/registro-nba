<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partidos NBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d12; --panel:#121820; --panel2:#0f151d; --line:#1f2a36;
  --fg:#e8eef5; --muted:#7d8ea0;
  --over:#2ee08a; --under:#ff5d6c; --live:#ffa640; --accent:#58c4ff;
  --display:"Barlow Condensed",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{max-width:720px;margin:0 auto;padding-block:20px 40px}
h1{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.02em;margin:0 0 14px;text-transform:uppercase}
.err{color:var(--under);margin:0 0 12px}
.resumen{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.kpi{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.kpi small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.sec{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:18px 0 8px}
.pos{color:var(--over)} .neg{color:var(--under)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card[data-open]{cursor:pointer}
.card.live{border-color:var(--live)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fecha{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip{font-family:var(--display);font-weight:800;font-size:15px;padding:4px 10px;border-radius:6px;color:#0a0d12;white-space:nowrap}
.chip.over{background:var(--over)} .chip.under{background:var(--under)}
.chip.live{background:var(--live)} .chip.next{background:#2a3a4a;color:var(--fg)} .chip.push{background:#ffb300}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.equipo{font-weight:600;font-size:16px}
.mitad{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.pts{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin:8px 0}
.lineas{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.lbl{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.linea{font-family:var(--display);font-weight:800;font-size:28px;color:var(--accent);line-height:1}
.der{text-align:right}
.sim{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.simrow{display:flex;gap:8px;align-items:stretch}
.simrow input{flex:1;min-width:0;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px}
.simrow button{border:0;border-radius:8px;padding:0 16px;font-family:var(--display);font-weight:800;font-size:16px;cursor:pointer;color:#06121a}
.simrow button[data-reg="OVER"]{background:var(--over)}
.simrow button[data-reg="UNDER"]{background:var(--under)}
.simrow button:disabled{background:#2a3a4a;color:var(--muted);cursor:not-allowed}
.simres{font-family:var(--mono);font-size:12px;margin:8px 0 0}
.volver{background:none;border:1px solid var(--line);color:var(--accent);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;margin-bottom:12px}
.titulo{font-family:var(--display);font-weight:800;font-size:28px;margin:4px 0 14px;text-transform:uppercase;line-height:1.1}
.cuartos{width:100%;border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums}
.cuartos th,.cuartos td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
.cuartos th:first-child,.cuartos td:first-child{text-align:left;font-family:var(--body);font-weight:600}
.cuartos thead th{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:400}
.cuartos .suma{color:var(--accent);font-family:var(--display);font-weight:800;font-size:20px}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.exportar{margin-top:14px;background:var(--accent);border:0;color:#06121a;border-radius:8px;padding:10px 14px;font-family:var(--display);font-weight:800;font-size:15px;cursor:pointer}
.editar{margin-top:8px;background:none;border:1px solid var(--line);color:var(--accent);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.total .big{font-family:var(--display);font-weight:800;font-size:40px;color:var(--accent);line-height:1}
</style>
</head>
<body>
<main>
  <h1>Partidos NBA</h1>
  <p id="err" class="err" hidden></p>
  <section class="resumen" id="resumen"></section>
  <div id="lista"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3cgkva87mriUf0omO-JYD3rhxULi5Sdw",
  authDomain: "registro-nba.firebaseapp.com",
  projectId: "registro-nba",
  storageBucket: "registro-nba.firebasestorage.app",
  messagingSenderId: "624895677560",
  appId: "1:624895677560:web:8659743dca4df40edb898d"
};

const UMBRAL = 5, ODD = 1.91;
const EN_JUEGO = ["Q1","Q2","Q3","Q4","OT","HT","BT"];
const db = getFirestore(initializeApp(firebaseConfig));
let juegos = [], apuestas = [], apuestaPorId = {}, seleccionado = null;
const borrador = {};

const $ = id => document.getElementById(id);
const showError = msg => { $("err").textContent = msg; $("err").hidden = !msg; };
const fmtFecha = iso => new Intl.DateTimeFormat("es-DO", {
  timeZone: "America/Santo_Domingo", weekday: "short", day: "2-digit", month: "2-digit",
  hour: "2-digit", minute: "2-digit", hour12: false
}).format(new Date(iso));

const enCurso = j => j.pts_final == null && EN_JUEGO.includes(j.estado);
const senal = (ritmo, linea) => ritmo >= linea + UMBRAL ? "OVER" : ritmo <= linea - UMBRAL ? "UNDER" : null;

// 0 = en curso, 1 = próximo, 2 = terminado
const grupo = j => enCurso(j) ? 0 : j.pts_final == null ? 1 : 2;
const ordenar = (a, b) => {
  const g = grupo(a) - grupo(b);
  if (g !== 0) return g;
  return grupo(a) === 2
    ? (a.fecha_utc < b.fecha_utc ? 1 : -1)
    : (a.fecha_utc < b.fecha_utc ? -1 : 1);
};

// unidades ganadas (+) o perdidas (-); null si el juego no ha terminado
function resultado(a, j) {
  const total = j?.pts_final;
  if (total == null) return null;
  if (total === a.linea_casa) return 0;
  const fueOver = total > a.linea_casa;
  return (a.lado === "OVER") === fueOver ? ODD - 1 : -1;
}

function etiqueta(j) {
  if (enCurso(j)) return { texto: `EN CURSO · ${j.pts_actual ?? 0}`, clase: "live" };
  if (j.pts_final == null) return { texto: "PRÓXIMO", clase: "next" };
  const t = j.pts_final, l = j.linea_mediana;
  if (l == null) return { texto: `FINAL ${t}`, clase: "next" };
  if (t > l) return { texto: `OVER · ${t}`, clase: "over" };
  if (t < l) return { texto: `UNDER · ${t}`, clase: "under" };
  return { texto: `PUSH · ${t}`, clase: "push" };
}

const brecha = a => Math.abs(a.ritmo - a.linea_casa);

function estadisticas(filtro, porId) {
  const sub = apuestas.filter(filtro).map(a => resultado(a, porId[a.id])).filter(r => r !== null);
  if (!sub.length) return "0 · -";
  const ac = sub.filter(r => r > 0).length;
  const u = sub.reduce((s, r) => s + r, 0);
  return `${sub.length} · ${(ac * 100 / sub.length).toFixed(0)} % · ROI ${(u * 100 / sub.length).toFixed(1)} %`;
}

function exportarCSV() {
  const porId = Object.fromEntries(juegos.map(j => [j.id, j]));
  const filas = [["fecha_utc", "partido", "lado", "linea_casa", "ritmo", "brecha", "odd", "linea_mediana", "pts_final", "resultado_u"]];
  apuestas.forEach(a => {
    const j = porId[a.id] ?? {};
    const r = resultado(a, j);
    filas.push([
      j.fecha_utc ?? "",
      `${j.equipo_visita ?? ""} @ ${j.equipo_local ?? ""}`,
      a.lado,
      a.linea_casa,
      a.ritmo,
      brecha(a).toFixed(1),
      a.odd ?? ODD,
      j.linea_mediana ?? "",
      j.pts_final ?? "",
      r == null ? "" : r.toFixed(2)
    ]);
  });
  const csv = filas.map(f => f.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.download = "simulador_nba.csv";
  enlace.click();
  URL.revokeObjectURL(url);
}

function render() {
  apuestaPorId = Object.fromEntries(apuestas.map(a => [a.id, a]));

  // Pantalla de detalle de un partido
  const abierto = juegos.find(j => j.id === seleccionado);
  $("resumen").hidden = !!abierto;
  if (abierto) {
    $("lista").innerHTML = detalle(abierto);
    return;
  }

  const porId = Object.fromEntries(juegos.map(j => [j.id, j]));

  const conRes = juegos.filter(j => j.pts_final != null && j.linea_mediana != null);
  const over = conRes.filter(j => j.pts_final > j.linea_mediana).length;
  const under = conRes.filter(j => j.pts_final < j.linea_mediana).length;
  const pct = (over * 100 / Math.max(over + under, 1)).toFixed(1);

  const res = apuestas.map(a => resultado(a, porId[a.id])).filter(r => r !== null);
  const aciertos = res.filter(r => r > 0).length;
  const unidades = res.reduce((s, r) => s + r, 0);
  const roi = res.length ? unidades * 100 / res.length : 0;
  const pctAciertos = res.length ? (aciertos * 100 / res.length).toFixed(1) : "0.0";

  $("resumen").innerHTML = `
    <div class="grid">
      <div class="kpi">${juegos.length}<small>registrados</small></div>
      <div class="kpi">${conRes.length}<small>con resultado</small></div>
      <div class="kpi"><span class="pos">${over}</span> / <span class="neg">${under}</span><small>over / under</small></div>
      <div class="kpi">${pct}%<small>over sobre la línea</small></div>
    </div>
    <div class="sec">Simulador (sin dinero real)</div>
    <div class="grid">
      <div class="kpi">${apuestas.length}<small>señales registradas · ${res.length} con resultado</small></div>
      <div class="kpi">${pctAciertos}%<small>aciertos · ${aciertos} de ${res.length}</small></div>
      <div class="kpi ${unidades >= 0 ? "pos" : "neg"}">${unidades.toFixed(2)}<small>unidades</small></div>
      <div class="kpi ${roi >= 0 ? "pos" : "neg"}">${roi.toFixed(1)}%<small>ROI</small></div>
    </div>
    <div class="sec">Desglose</div>
    <div class="meta">Por lado (n · acierto · ROI)</div>
    <div class="meta">OVER: ${estadisticas(a => a.lado === "OVER", porId)}</div>
    <div class="meta">UNDER: ${estadisticas(a => a.lado === "UNDER", porId)}</div>
    <div class="meta">Diferencia ritmo − línea</div>
    <div class="meta">5 a 7: ${estadisticas(a => brecha(a) < 7, porId)}</div>
    <div class="meta">7 a 10: ${estadisticas(a => brecha(a) >= 7 && brecha(a) < 10, porId)}</div>
    <div class="meta">10 o más: ${estadisticas(a => brecha(a) >= 10, porId)}</div>
    <button class="exportar" data-exportar>Exportar simulador (CSV)</button>`;

  $("lista").innerHTML = [...juegos].sort(ordenar).map(tarjeta).join("");
}

const fila = (nombre, mitad, pts) => `
  <div class="fila">
    <div><div class="equipo">${nombre}</div><div class="mitad">1ª mitad: ${mitad ?? "-"}</div></div>
    <div class="pts">${pts ?? "-"}</div>
  </div>`;

function tarjeta(j) {
  const ml = j.mitad_local, mv = j.mitad_visita;
  const ritmo = ml != null && mv != null ? (ml + mv) * 2 : null;
  const e = etiqueta(j);
  return `
  <article class="card${enCurso(j) ? " live" : ""}" data-open="${j.id}">
    <div class="top"><span class="fecha">${fmtFecha(j.fecha_utc)}</span><span class="chip ${e.clase}">${e.texto}</span></div>
    ${fila(j.equipo_visita, mv, j.pts_visita)}
    ${fila(j.equipo_local, ml, j.pts_local)}
    ${ritmo != null ? `<p class="meta">Total 1ª mitad: ${ml + mv} · ritmo ×2: ${ritmo}</p>` : ""}
    ${enCurso(j) && j.ritmo_vivo != null ? `<p class="meta">Ritmo en vivo: ${j.ritmo_vivo}</p>` : ""}
    <div class="lineas">
      <div><span class="lbl">Línea</span><span class="linea">${j.linea_mediana ?? "-"}</span></div>
      <div class="der"><span class="lbl">Pinnacle</span><span>${j.linea_pinnacle ?? "-"}</span>
        <div class="meta">O ${j.over_pinnacle ?? "-"} · U ${j.under_pinnacle ?? "-"}</div></div>
    </div>
    ${seccionSim(j, ritmo)}
  </article>`;
}

// Suma de los cuartos disponibles; null si ninguno tiene datos todavía
const sumaCuartos = v => v.every(x => x == null) ? null : v.filter(x => x != null).reduce((s, x) => s + x, 0);

function detalle(j) {
  const qv = [j.q1_visita, j.q2_visita, j.q3_visita, j.q4_visita];
  const ql = [j.q1_local, j.q2_local, j.q3_local, j.q4_local];
  const sv = sumaCuartos(qv), sl = sumaCuartos(ql);
  const comb = sv == null && sl == null ? "-" : (sv ?? 0) + (sl ?? 0);
  const ml = j.mitad_local, mv = j.mitad_visita;
  const ritmo = ml != null && mv != null ? (ml + mv) * 2 : null;
  const e = etiqueta(j);
  const celda = v => v ?? "-";
  const filaCuartos = (nombre, qs, s) =>
    `<tr><th>${nombre}</th>${qs.map(q => `<td>${celda(q)}</td>`).join("")}<td class="suma">${celda(s)}</td></tr>`;

  return `
  <button class="volver" data-volver>← Volver a partidos</button>
  <article class="card${enCurso(j) ? " live" : ""}">
    <div class="top"><span class="fecha">${fmtFecha(j.fecha_utc)}</span><span class="chip ${e.clase}">${e.texto}</span></div>
    <h2 class="titulo">${j.equipo_visita} @ ${j.equipo_local}</h2>
    <table class="cuartos">
      <thead><tr><th></th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Suma</th></tr></thead>
      <tbody>
        ${filaCuartos(j.equipo_visita, qv, sv)}
        ${filaCuartos(j.equipo_local, ql, sl)}
      </tbody>
    </table>
    ${enCurso(j) && j.ritmo_vivo != null ? `<p class="meta">Ritmo en vivo: ${j.ritmo_vivo}</p>` : ""}
    <div class="total">
      <span class="lbl">Total combinado</span>
      <span class="big">${comb}</span>
    </div>
  </article>
  <article class="card">
    <div class="lineas">
      <div><span class="lbl">Línea</span><span class="linea">${j.linea_mediana ?? "-"}</span></div>
      <div class="der"><span class="lbl">Pinnacle</span><span>${j.linea_pinnacle ?? "-"}</span>
        <div class="meta">O ${j.over_pinnacle ?? "-"} · U ${j.under_pinnacle ?? "-"}</div></div>
    </div>
    ${seccionSim(j, ritmo)}
  </article>`;
}

function seccionSim(j, ritmo) {
  const a = apuestaPorId[j.id];
  if (a) {
    const r = resultado(a, j);
    const txt = r == null ? `Tu elección: ${a.lado} ${a.linea_casa} · ritmo ${a.ritmo}`
      : r > 0 ? `Tu elección: ${a.lado} ${a.linea_casa} · ACERTÓ +${r.toFixed(2)} u`
      : r < 0 ? `Tu elección: ${a.lado} ${a.linea_casa} · FALLÓ ${r.toFixed(2)} u`
      : `Tu elección: ${a.lado} ${a.linea_casa} · PUSH 0 u`;
    const color = r == null ? "var(--muted)" : r > 0 ? "var(--over)" : r < 0 ? "var(--under)" : "#ffb300";
    const editar = r == null ? `<button class="editar" data-editar="${j.id}">Editar elección</button>` : "";
    return `<div class="sim"><p class="simres" style="color:${color}">${txt}</p>${editar}</div>`;
  }
  if (j.pts_final != null) return "";
  const r = ritmo ?? 0;
  return `
  <div class="sim" data-id="${j.id}" data-ritmo="${r}" data-hay="${ritmo != null}">
    <div class="simrow">
      <input inputmode="decimal" placeholder="Línea de la casa" value="${borrador[j.id] ?? ""}" data-linea="${j.id}">
      <button data-reg="OVER" disabled>OVER</button>
      <button data-reg="UNDER" disabled>UNDER</button>
    </div>
    <p class="meta" data-msg>${ritmo != null ? "Escribe la línea de la casa para elegir OVER o UNDER" : "Esperando el medio tiempo para calcular el ritmo"}</p>
  </div>`;
}

function actualizarSenal(simDiv) {
  const id = simDiv.dataset.id;
  const hayRitmo = simDiv.dataset.hay === "true";
  const ritmo = Number(simDiv.dataset.ritmo);
  const linea = parseFloat((borrador[id] ?? "").replace(",", "."));
  const valida = !isNaN(linea) && hayRitmo;
  simDiv.querySelectorAll("[data-reg]").forEach(b => b.disabled = !valida);
  const lado = valida ? senal(ritmo, linea) : null;
  simDiv.querySelector("[data-msg]").textContent =
    !hayRitmo ? "Esperando el medio tiempo para calcular el ritmo"
    : isNaN(linea) ? "Escribe la línea de la casa para elegir OVER o UNDER"
    : lado ? `Señal de la regla: ${lado}`
    : `Señal de la regla: ninguna (ritmo a menos de ${UMBRAL} puntos de la línea)`;
}

const lista = $("lista");
$("resumen").addEventListener("click", e => {
  if (e.target.closest("[data-exportar]")) exportarCSV();
});
lista.addEventListener("input", e => {
  const inp = e.target.closest("[data-linea]");
  if (!inp) return;
  borrador[inp.dataset.linea] = inp.value;
  actualizarSenal(inp.closest(".sim"));
});

lista.addEventListener("click", async e => {
  if (e.target.closest("[data-volver]")) {
    seleccionado = null;
    render();
    window.scrollTo(0, 0);
    return;
  }
  const editar = e.target.closest("[data-editar]");
  if (editar) {
    const id = editar.dataset.editar;
    const previa = apuestaPorId[id];
    if (previa) borrador[id] = String(previa.linea_casa);
    try {
      await deleteDoc(doc(db, "simulador", id));
    } catch (err) {
      showError(err.message);
    }
    return;
  }
  const btn = e.target.closest("[data-reg]");
  if (btn) {
    if (btn.disabled) return;
    const id = btn.closest(".sim").dataset.id;
    const ritmo = Number(btn.closest(".sim").dataset.ritmo);
    const linea = parseFloat((borrador[id] ?? "").replace(",", "."));
    if (isNaN(linea)) return;
    try {
      await setDoc(doc(db, "simulador", id), {
        lado: btn.dataset.reg, linea_casa: linea, ritmo, odd: ODD, creado_utc: Date.now()
      });
    } catch (err) {
      showError(err.message);
    }
    return;
  }
  if (e.target.closest("input")) return;
  const card = e.target.closest("[data-open]");
  if (card) {
    seleccionado = card.dataset.open;
    render();
    window.scrollTo(0, 0);
  }
});

onSnapshot(query(collection(db, "juegos"), orderBy("fecha_utc")),
  snap => { juegos = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); },
  err => showError(err.message));

onSnapshot(collection(db, "simulador"),
  snap => { apuestas = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); },
  err => showError(err.message));
</script>
</body>
</html>
